{% extends "base.html" %}

{% block title %}注册{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container" style="max-width: 500px;">
        <div class="auth-card">
            <div class="auth-title">
                <i class="fas fa-coins fa-3x text-primary mb-3"></i>
                <h2>创建账户</h2>
                <p class="text-muted">加入云享财富，开启理财之旅</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-text">用于登录系统的账号名</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="请设置密码" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="real_name" class="form-label">真实姓名 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                        <input type="text" class="form-control" id="real_name" name="real_name" placeholder="请输入真实姓名" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="id_card" class="form-label">身份证号 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-address-card"></i></span>
                        <input type="text" class="form-control" id="id_card" name="id_card" placeholder="请输入18位身份证号" maxlength="18" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">手机号码 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-mobile-alt"></i></span>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入11位手机号" maxlength="11" required>
                    </div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="agree" required>
                    <label class="form-check-label" for="agree">
                        我已阅读并同意 <a href="#">《用户服务协议》</a> 和 <a href="#">《隐私政策》</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="fas fa-user-plus me-2"></i>立即注册
                </button>
            </form>

            <hr class="my-4">

            <p class="text-center text-muted mb-0">
                已有账户？<a href="{{ url_for('login') }}">立即登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
