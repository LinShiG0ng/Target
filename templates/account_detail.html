{% extends "base.html" %}

{% block title %}账户详情{% endblock %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">首页</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('accounts') }}">我的账户</a></li>
            <li class="breadcrumb-item active">账户详情</li>
        </ol>
    </nav>

    <h4 class="mb-4">
        <i class="fas fa-chart-line me-2"></i>账户详情
    </h4>

    <div class="row">
        <div class="col-lg-8">
            <div id="account-detail-container">
                <div class="loading"></div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-cog me-2"></i>账户操作
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" disabled>
                            <i class="fas fa-plus me-2"></i>充值
                        </button>
                        <button class="btn btn-outline-primary" disabled>
                            <i class="fas fa-minus me-2"></i>提现
                        </button>
                        <button class="btn btn-outline-primary" disabled>
                            <i class="fas fa-exchange-alt me-2"></i>转账
                        </button>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    <i class="fas fa-info-circle me-2"></i>账户说明
                </div>
                <div class="card-body">
                    <ul class="small text-muted mb-0">
                        <li class="mb-2">活期账户支持随时存取</li>
                        <li class="mb-2">定期理财收益更高</li>
                        <li class="mb-2">基金账户支持多种投资</li>
                        <li>所有资金由银行托管</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
